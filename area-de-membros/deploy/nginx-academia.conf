# Academia Foco — site para nginx
# O instalador troca __DOMINIO__ e __PORTA__ e depois chama o certbot (HTTPS é obrigatório:
# o login usa cookie seguro, que o navegador só guarda em https).

server {
    listen 80;
    listen [::]:80;
    server_name __DOMINIO__;

    access_log /var/log/nginx/academia.access.log;
    error_log  /var/log/nginx/academia.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/csv;
    gzip_min_length 1024;

    # arquivos com hash no nome: cache longo
    location /_next/static/ {
        proxy_pass http://127.0.0.1:__PORTA__;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://127.0.0.1:__PORTA__;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
        client_max_body_size 2m;
    }
}
